name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The light list: no PyTorch / sentence-transformers / spacy (see the header of requirements-ci.txt).
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # No API keys, no .env, no vector index, no sample CV: the suite is offline by design.
      # The tests that load the real models are marked and left out.
      - name: Run the tests
        run: python -m pytest -m "not real_models" -q --durations=10
