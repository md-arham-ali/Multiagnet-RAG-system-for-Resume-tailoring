[pytest]
testpaths = tests
# No .pytest_cache, and a typo in a marker name is an error, not a silently ignored mark.
addopts = -p no:cacheprovider --strict-markers
markers =
    real_models: loads the real embedder / reranker (needs RUN_REAL_EMBED=1, RUN_REAL_RERANK=1, the sample CV and a built index). Never run in CI: `pytest -m "not real_models"`.
    easy: one function or one store, nothing else (seconds). Assigned automatically in conftest.py.
    medium: parts put together: a graph, the HTTP app, a scripted provider, threads, a fresh process, a repo read. Assigned automatically.
