<svg viewBox="0 0 930 1120" width="930" height="1120" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" font-size="13"><title>Review loop: agents decide, supervisor routes</title><desc>Critic, verifier and the gate 4 human each decide a verdict and return it to the supervisor; the supervisor checks the verdict and counter and either redoes document or moves on. A two-lane flow on the right shows decide steps versus route steps.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#BA7517"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A32D2D"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g text-anchor="middle" font-size="12"><text x="90" y="26" fill="#5F5E5A">Hub</text><text x="265" y="26" fill="#854F0B">Human gates</text><text x="480" y="26" fill="#5F5E5A">Agents (stage order)</text><text x="758" y="26" fill="#5F5E5A">Loop outputs</text></g><rect x="20" y="40" width="140" height="754" rx="10" fill="#E6F1FB" stroke="#185FA5"/><g text-anchor="middle"><text x="90" y="360" fill="#0C447C">Supervisor</text><text x="90" y="382" font-size="11" fill="#185FA5">routes, never judges</text><text x="90" y="400" font-size="11" fill="#185FA5">reads verdict + count</text><text x="90" y="418" font-size="11" fill="#185FA5">max_revisions = 2</text><text x="90" y="436" font-size="11" fill="#185FA5">no LLM call</text></g><g fill="none" stroke="#B4B2A9" stroke-dasharray="2 3" marker-end="url(#s)"><path d="M480 94V138"/><path d="M480 194V238"/><path d="M480 294V338"/><path d="M480 394V438"/><path d="M480 494V538"/><path d="M480 594V638"/><path d="M480 694V738"/></g><g fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#b)"><path d="M160 56H398"/><path d="M160 156H398"/><path d="M160 256H398"/><path d="M160 356H398"/><path d="M160 446H398"/><path d="M160 556H398"/><path d="M160 656H398"/><path d="M160 756H398"/><path d="M160 111H198"/><path d="M160 211H198"/><path d="M160 411H198"/><path d="M160 711H198"/></g><path d="M160 468H398" fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#r)"/><g fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#s)"><path d="M400 78H162"/><path d="M400 178H162"/><path d="M400 278H162"/><path d="M400 378H162"/><path d="M400 486H162"/><path d="M400 778H162"/></g><g fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#r)"><path d="M400 578H162"/><path d="M400 678H162"/></g><g fill="none" stroke="#BA7517" stroke-width="1.3" marker-end="url(#g)"><path d="M200 125H162"/><path d="M200 225H162"/><path d="M200 425H162"/><path d="M200 725H162"/></g><g font-size="11" text-anchor="middle"><text x="280" y="50" fill="#185FA5">dispatch</text><text x="280" y="92" fill="#5F5E5A">return state</text><text x="345" y="463" fill="#A32D2D">redo</text><text x="290" y="573" fill="#A32D2D">verdict: pass | revise</text><text x="290" y="673" fill="#A32D2D">status: pass | fail</text></g><g fill="#FAEEDA" stroke="#BA7517"><rect x="200" y="99" width="135" height="36" rx="6"/><rect x="200" y="199" width="135" height="36" rx="6"/><rect x="200" y="399" width="135" height="36" rx="6"/><rect x="200" y="699" width="135" height="36" rx="6"/></g><g font-size="11" fill="#633806"><text x="208" y="114">Gate 1: requirements</text><text x="208" y="214">Gate 2: evidence + gaps</text><text x="208" y="414">Gate 3: fit report</text><text x="208" y="714">Gate 4: document</text></g><g font-size="11" fill="#854F0B"><text x="208" y="129">reject: jd_analysis</text><text x="208" y="229">reject: profile</text><text x="208" y="429">reject: matching</text><text x="208" y="729">reject: document</text></g><g fill="#F1EFE8" stroke="#B4B2A9"><rect x="400" y="40" width="160" height="54" rx="8"/><rect x="400" y="140" width="160" height="54" rx="8"/><rect x="400" y="240" width="160" height="54" rx="8"/><rect x="400" y="340" width="160" height="54" rx="8"/><rect x="400" y="440" width="160" height="54" rx="8"/><rect x="400" y="740" width="160" height="54" rx="8"/></g><g fill="#FCEBEB" stroke="#A32D2D"><rect x="400" y="540" width="160" height="54" rx="8"/><rect x="400" y="640" width="160" height="54" rx="8"/></g><g fill="#EEEDFE" stroke="#534AB7"><rect x="524" y="44" width="32" height="16" rx="4"/><rect x="524" y="144" width="32" height="16" rx="4"/><rect x="524" y="244" width="32" height="16" rx="4"/><rect x="524" y="344" width="32" height="16" rx="4"/><rect x="524" y="544" width="32" height="16" rx="4"/><rect x="524" y="444" width="32" height="16" rx="4"/></g><g font-size="11" text-anchor="middle" fill="#3C3489"><text x="540" y="56">LLM</text><text x="540" y="156">LLM</text><text x="540" y="256">LLM</text><text x="540" y="356">LLM</text><text x="540" y="556">LLM</text><text x="540" y="456">LLM</text></g><g fill="#1F1F1E"><text x="410" y="66">jd_analysis</text><text x="410" y="166">profile</text><text x="410" y="266">profile_enrich</text><text x="410" y="366">matching</text><text x="410" y="466">document</text><text x="410" y="566" fill="#791F1F">critic</text><text x="410" y="666" fill="#791F1F">verifier</text><text x="410" y="766">evaluation</text></g><g font-size="11" fill="#5F5E5A"><text x="410" y="84">1 call: extract reqs</text><text x="410" y="184">retrieve, then 1 call</text><text x="410" y="284">call only if answers</text><text x="410" y="384">call only if reqs exist</text><text x="410" y="484">2 calls: plan + write</text><text x="410" y="584" fill="#A32D2D">decides pass | revise</text><text x="410" y="684" fill="#A32D2D">decides (stub: pass)</text><text x="410" y="784">stub, no LLM yet</text></g><rect x="615" y="40" width="285" height="96" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/><text x="629" y="60" fill="#1F1F1E">Critique (critic decision)</text><g font-size="11" fill="#5F5E5A"><text x="629" y="79">verdict: pass | revise</text><text x="629" y="96">items[]: rubric_item, severity, location,</text><text x="641" y="112">instruction</text><text x="629" y="128">rubric: relevance, traceability, readability</text></g><rect x="615" y="148" width="285" height="86" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/><text x="629" y="168" fill="#1F1F1E">VerifierReport (verifier decision)</text><g font-size="11" fill="#5F5E5A"><text x="629" y="187">status: pass | fail</text><text x="629" y="204">claims[]: supported | unsupported | contradicted</text><text x="629" y="221">do_not_claim_hits[]: any hit = fail (planned)</text></g><text x="615" y="264" fill="#1F1F1E" font-size="12">One review round</text><g text-anchor="middle" font-size="12"><text x="683" y="286" fill="#A32D2D">Decides (agent or human)</text><text x="831" y="286" fill="#185FA5">Routes (supervisor)</text></g><path d="M757 274V818" stroke="#B4B2A9" stroke-dasharray="2 3"/><g fill="#F1EFE8" stroke="#B4B2A9"><rect x="615" y="300" width="137" height="40" rx="6"/><rect x="615" y="772" width="137" height="40" rx="6"/></g><g fill="#FCEBEB" stroke="#A32D2D"><rect x="615" y="404" width="137" height="44" rx="6"/><rect x="615" y="512" width="137" height="40" rx="6"/></g><rect x="615" y="668" width="137" height="40" rx="6" fill="#FAEEDA" stroke="#BA7517"/><g fill="#E6F1FB" stroke="#185FA5"><rect x="762" y="352" width="138" height="40" rx="6"/><rect x="762" y="460" width="138" height="40" rx="6"/><rect x="762" y="564" width="138" height="40" rx="6"/><rect x="762" y="616" width="138" height="40" rx="6"/><rect x="762" y="720" width="138" height="40" rx="6"/></g><g font-size="12"><text x="623" y="317" fill="#1F1F1E">document</text><text x="623" y="422" fill="#791F1F">critic (LLM)</text><text x="623" y="529" fill="#791F1F">verifier</text><text x="623" y="685" fill="#633806">human at gate 4</text><text x="623" y="789" fill="#1F1F1E">evaluation</text><text x="770" y="369" fill="#0C447C">set active_rubric</text><text x="770" y="477" fill="#0C447C">revise and count&lt;2?</text><text x="770" y="581" fill="#0C447C">fail and count&lt;2?</text><text x="770" y="633" fill="#0C447C">gate 4 open?</text><text x="770" y="737" fill="#0C447C">reject and count&lt;2?</text></g><g font-size="11"><text x="623" y="332" fill="#5F5E5A">patches CV lines</text><text x="623" y="439" fill="#A32D2D">verdict + items</text><text x="623" y="545" fill="#A32D2D">status (stub: pass)</text><text x="623" y="700" fill="#854F0B">approve | edit | reject</text><text x="623" y="804" fill="#5F5E5A">then DONE</text><text x="770" y="384" fill="#185FA5">dispatch critic</text><text x="770" y="492" fill="#185FA5">no: dispatch verifier</text><text x="770" y="596" fill="#185FA5">no: check gate 4</text><text x="770" y="648" fill="#185FA5">not answered this round</text><text x="770" y="752" fill="#185FA5">no: dispatch evaluation</text></g><g fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"><path d="M683 340V372H760"/><path d="M831 392V426H754"/><path d="M683 448V480H760"/><path d="M831 500V532H754"/><path d="M683 552V584H760"/><path d="M831 604V614"/><path d="M831 656V688H754"/><path d="M683 708V740H760"/><path d="M831 760V792H754"/></g><g fill="none" stroke="#A32D2D" stroke-width="1.6"><path d="M900 480H916"/><path d="M900 584H916"/><path d="M900 740H916"/><path d="M916 740V312H754" marker-end="url(#r)"/></g><text x="770" y="317" font-size="11" fill="#A32D2D">yes: redo, count + 1,</text><text x="770" y="332" font-size="11" fill="#A32D2D">clear verdicts</text><g font-size="11" fill="#5F5E5A"><path d="M20 842H50" stroke="#185FA5" stroke-width="1.3" marker-end="url(#b)"/><text x="58" y="846">dispatch</text><path d="M150 842H120" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#s)"/><text x="158" y="846">return</text><path d="M260 842H230" stroke="#BA7517" stroke-width="1.3" marker-end="url(#g)"/><text x="268" y="846">human decision</text><path d="M400 842H370" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#r)"/><text x="408" y="846">agent verdict / supervisor redo</text><rect x="600" y="834" width="28" height="14" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="636" y="846">LLM call</text></g><rect x="20" y="866" width="440" height="236" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/><text x="36" y="890" fill="#1F1F1E">Who does what</text><g font-size="11" fill="#5F5E5A"><text x="36" y="912">Decide: critic judges the draft (pass | revise),</text><text x="36" y="928">verifier judges claims (pass | fail), the human</text><text x="36" y="944">judges at the gate (approve | edit | reject).</text><text x="36" y="964">Route: the supervisor only reads those verdicts</text><text x="36" y="980">plus revision_count, then picks the next node.</text><text x="36" y="996">It owns the counter and clears stale verdicts.</text><text x="36" y="1020">Counter example, no earlier rejects:</text><text x="52" y="1037">round 0: draft 1, revise  then  count 1</text><text x="52" y="1053">round 1: draft 2, revise  then  count 2</text><text x="52" y="1069">round 2: draft 3, revise ignored, move on</text><text x="36" y="1090">At most 3 drafts. Earlier gate rejects use up rounds.</text></g><rect x="480" y="866" width="420" height="236" rx="10" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"/><text x="496" y="890" fill="#1F1F1E">Gaps today, and the agreed plan</text><g font-size="11" fill="#A32D2D"><text x="496" y="912">Supervisor acts on the critic verdict before verifier runs.</text><text x="496" y="928">document ignores critique items: redo makes the same draft.</text><text x="496" y="944">verifier always passes, so the fail branch never fires.</text></g><g font-size="11" fill="#5F5E5A"><text x="496" y="968">Planned (decide stays with agents, routing richer):</text><text x="496" y="986">supervisor waits for both critic and verifier</text><text x="496" y="1003">each item names a fixing_agent (agent decides who)</text><text x="496" y="1020">gate 5: human deletes, reassigns or annotates items</text><text x="496" y="1037">supervisor builds fix_queue in pipeline order,</text><text x="496" y="1054">document last; count once per round</text><text x="496" y="1071">each gate opens at most 2 times per run</text><text x="496" y="1088">verifier: do-not-claim rapidfuzz + semantic, no LLM</text></g></svg>
