<svg viewBox="0 0 920 905" width="920" height="905" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" font-size="13"><title>Agent flow with verified gate wiring</title><desc>The supervisor dispatches agents and gates; each gate returns approve, edit or reject to the supervisor, which advances to the next agent or sends work back to the producing agent. A data column on the right shows retrieval and storage.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#BA7517"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g text-anchor="middle" font-size="12"><text x="90" y="26" fill="#5F5E5A">Hub</text><text x="265" y="26" fill="#854F0B">Human gates</text><text x="480" y="26" fill="#5F5E5A">Agents (stage order)</text><text x="770" y="26" fill="#0F6E56">Knowledge + RAG + learning</text></g><rect x="20" y="40" width="140" height="754" rx="10" fill="#E6F1FB" stroke="#185FA5"/><g text-anchor="middle"><text x="90" y="390" fill="#0C447C">Supervisor</text><text x="90" y="412" font-size="11" fill="#185FA5">decide() + route()</text><text x="90" y="430" font-size="11" fill="#185FA5">revision cap</text><text x="90" y="448" font-size="11" fill="#185FA5">critic rubric</text></g><g fill="none" stroke="#B4B2A9" stroke-dasharray="2 3" marker-end="url(#s)"><path d="M480 94V138"/><path d="M480 194V238"/><path d="M480 294V338"/><path d="M480 394V438"/><path d="M480 494V538"/><path d="M480 594V638"/><path d="M480 694V738"/></g><g fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#b)"><path d="M160 56H398"/><path d="M160 156H398"/><path d="M160 256H398"/><path d="M160 356H398"/><path d="M160 456H398"/><path d="M160 556H398"/><path d="M160 656H398"/><path d="M160 756H398"/><path d="M160 111H198"/><path d="M160 211H198"/><path d="M160 411H198"/><path d="M160 711H198"/></g><g fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#s)"><path d="M400 78H162"/><path d="M400 178H162"/><path d="M400 278H162"/><path d="M400 378H162"/><path d="M400 478H162"/><path d="M400 578H162"/><path d="M400 678H162"/><path d="M400 778H162"/></g><g fill="none" stroke="#BA7517" stroke-width="1.3" marker-end="url(#g)"><path d="M200 125H162"/><path d="M200 225H162"/><path d="M200 425H162"/><path d="M200 725H162"/></g><g font-size="11" text-anchor="middle"><text x="280" y="50" fill="#185FA5">dispatch</text><text x="280" y="92" fill="#5F5E5A">return state</text></g><g fill="#FAEEDA" stroke="#BA7517"><rect x="200" y="99" width="135" height="36" rx="6"/><rect x="200" y="199" width="135" height="36" rx="6"/><rect x="200" y="399" width="135" height="36" rx="6"/><rect x="200" y="699" width="135" height="36" rx="6"/></g><g font-size="11" fill="#633806"><text x="208" y="114">Gate 1: requirements</text><text x="208" y="214">Gate 2: evidence + gaps</text><text x="208" y="414">Gate 3: fit report</text><text x="208" y="714">Gate 4: document</text></g><g font-size="11" fill="#854F0B"><text x="208" y="129">reject: jd_analysis</text><text x="208" y="229">reject: profile</text><text x="208" y="429">reject: matching</text><text x="208" y="729">reject: document</text></g><g fill="#F1EFE8" stroke="#B4B2A9"><rect x="400" y="40" width="160" height="54" rx="8"/><rect x="400" y="140" width="160" height="54" rx="8"/><rect x="400" y="240" width="160" height="54" rx="8"/><rect x="400" y="340" width="160" height="54" rx="8"/><rect x="400" y="440" width="160" height="54" rx="8"/><rect x="400" y="540" width="160" height="54" rx="8"/><rect x="400" y="640" width="160" height="54" rx="8"/><rect x="400" y="740" width="160" height="54" rx="8"/></g><g text-anchor="middle" fill="#1F1F1E"><text x="480" y="63">jd_analysis</text><text x="480" y="163">profile</text><text x="480" y="263">profile_enrich</text><text x="480" y="363">matching</text><text x="480" y="463">document</text><text x="480" y="563">critic</text><text x="480" y="663">verifier</text><text x="480" y="763">evaluation</text></g><g text-anchor="middle" font-size="11" fill="#5F5E5A"><text x="480" y="80">extract requirements</text><text x="480" y="180">retrieve + grade evidence</text><text x="480" y="280">polish gap answers</text><text x="480" y="380">fit score</text><text x="480" y="480">CV patcher, 2 LLM calls</text><text x="480" y="580">rubric: pass / revise</text><text x="480" y="680">fact check (stub)</text><text x="480" y="780">score (stub)</text></g><g fill="#E1F5EE" stroke="#0F6E56"><rect x="640" y="130" width="260" height="70" rx="8"/><rect x="640" y="240" width="260" height="70" rx="8"/><rect x="640" y="350" width="260" height="70" rx="8"/></g><g fill="none" stroke="#0F6E56" stroke-dasharray="4 3"><rect x="640" y="530" width="260" height="70" rx="8"/><rect x="640" y="636" width="260" height="56" rx="8"/></g><g text-anchor="middle" fill="#085041"><text x="770" y="154">Retriever (RAG)</text><text x="770" y="264">Chroma vector store</text><text x="770" y="374">Knowledge base (JSON)</text><text x="770" y="554">Learning store</text><text x="770" y="658">Do-not-claim list</text></g><g text-anchor="middle" font-size="11" fill="#0F6E56"><text x="770" y="172">hybrid search + cross-encoder</text><text x="770" y="188">rerank</text><text x="770" y="282">bge-base embeddings, cosine</text><text x="770" y="298">profile, documents, learning</text><text x="770" y="392">source of truth, incl.</text><text x="770" y="408">manual_entries.json</text><text x="770" y="572">exemplars, corrections, feedback</text><text x="770" y="588">no callers yet</text><text x="770" y="676">plain JSON, never embedded</text></g><g fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#t)"><path d="M560 152H638"/><path d="M638 178H562"/><path d="M745 200V238"/><path d="M795 240V202"/><path d="M770 350V312"/><path d="M560 258H638"/><path d="M560 282L638 362"/></g><g fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#t)"><path d="M560 566H638"/><path d="M638 664H562"/></g><g font-size="11" fill="#0F6E56"><text x="740" y="223" text-anchor="end">search</text><text x="801" y="223">hits</text><text x="776" y="336">ingest</text></g><g font-size="11" fill="#5F5E5A"><path d="M20 822H50" stroke="#185FA5" stroke-width="1.3" marker-end="url(#b)"/><text x="58" y="826">supervisor dispatches agent or gate</text><path d="M290 822H260" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#s)"/><text x="298" y="826">agent returns state + next stage</text><path d="M530 822H500" stroke="#BA7517" stroke-width="1.3" marker-end="url(#g)"/><text x="538" y="826">gate returns approve / edit / reject</text><path d="M770 822H800" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#t)"/><text x="808" y="826">data I/O</text><text x="20" y="852">A gate opens when the next stage is gated and has no answer for the current round. It never changes the stage itself.</text><text x="20" y="870">Approve or edit: the supervisor advances to the next agent. Reject: it re-dispatches the producer and charges a revision.</text><text x="20" y="888">Gate 2 also returns gap answers for profile_enrich. Gate 5 (critique) is planned and not in code.</text></g></svg>
