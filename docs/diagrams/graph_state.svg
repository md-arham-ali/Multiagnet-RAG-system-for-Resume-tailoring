<svg viewBox="0 0 930 930" width="930" height="930" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" font-size="13"><title>GraphState fields and which agent writes each</title><desc>Agents in the middle column each write one or two GraphState fields on the right; the readers of each field are listed in its row. The data layer on the left shows retrieval and storage.</desc><defs><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#534AB7"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g text-anchor="middle" font-size="12"><text x="115" y="56" fill="#0F6E56">Knowledge + RAG + learning</text><text x="330" y="56" fill="#5F5E5A">Agents (stage order)</text><text x="685" y="30" fill="#3C3489">GraphState (shared, checkpointed to SQLite)</text></g><rect x="460" y="40" width="450" height="712" rx="10" fill="none" stroke="#534AB7"/><text x="478" y="62" font-size="11" fill="#534AB7">field: type</text><text x="892" y="62" font-size="11" fill="#534AB7" text-anchor="end">read by</text><g fill="#F1EFE8" stroke="#B4B2A9"><rect x="470" y="70" width="430" height="50" rx="6"/><rect x="470" y="132" width="430" height="50" rx="6"/><rect x="470" y="194" width="430" height="50" rx="6"/><rect x="470" y="256" width="430" height="50" rx="6"/><rect x="470" y="318" width="430" height="50" rx="6"/><rect x="470" y="380" width="430" height="50" rx="6"/><rect x="470" y="442" width="430" height="50" rx="6"/><rect x="470" y="504" width="430" height="50" rx="6"/><rect x="470" y="566" width="430" height="50" rx="6"/><rect x="470" y="628" width="430" height="50" rx="6"/><rect x="470" y="690" width="430" height="50" rx="6"/></g><g fill="#1F1F1E"><text x="484" y="92">job_description</text><text x="484" y="154">requirements</text><text x="484" y="216">evidence</text><text x="484" y="278">gap_questions</text><text x="484" y="340">gap_answers</text><text x="484" y="402">evidence (append)</text><text x="484" y="464">fit_report</text><text x="484" y="526">document</text><text x="484" y="588">critique</text><text x="484" y="650">verifier_report</text><text x="484" y="712">eval_record</text></g><g font-size="11" fill="#5F5E5A"><text x="484" y="109">str, the job posting</text><text x="484" y="171">Requirements: must / nice-to-have</text><text x="484" y="233">list[ProfileBlock], deduped by source_id</text><text x="484" y="295">list[GapQuestion] for weak requirements</text><text x="484" y="357">dict requirement to answer</text><text x="484" y="419">+ polished gap_answer blocks</text><text x="484" y="481">FitReport: overall_fit, ranked evidence</text><text x="484" y="543">Document: patched CV (Markdown)</text><text x="484" y="605">Critique: verdict pass / revise, items</text><text x="484" y="667">VerifierReport: status pass / fail</text><text x="484" y="729">EvalRecord: scores</text></g><g font-size="11" fill="#3C3489" text-anchor="end"><text x="892" y="100">jd_analysis</text><text x="892" y="162">profile, matching, critic</text><text x="892" y="224">matching, gate 2</text><text x="892" y="286">profile_enrich, gate 2</text><text x="892" y="348">profile_enrich</text><text x="892" y="410">matching</text><text x="892" y="472">critic, gate 3</text><text x="892" y="534">critic, gate 4</text><text x="892" y="596">supervisor (loop-back)</text><text x="892" y="658">supervisor (loop-back)</text><text x="892" y="720">end of run</text></g><rect x="250" y="70" width="160" height="50" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"/><g fill="#F1EFE8" stroke="#B4B2A9"><rect x="250" y="132" width="160" height="50" rx="8"/><rect x="250" y="194" width="160" height="112" rx="8"/><rect x="250" y="380" width="160" height="50" rx="8"/><rect x="250" y="442" width="160" height="50" rx="8"/><rect x="250" y="504" width="160" height="50" rx="8"/><rect x="250" y="566" width="160" height="50" rx="8"/><rect x="250" y="628" width="160" height="50" rx="8"/><rect x="250" y="690" width="160" height="50" rx="8"/></g><rect x="270" y="324" width="120" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517"/><g text-anchor="middle" fill="#1F1F1E"><text x="330" y="100">run input (user)</text><text x="330" y="153">jd_analysis</text><text x="330" y="245">profile</text><text x="330" y="401">profile_enrich</text><text x="330" y="463">matching</text><text x="330" y="525">document</text><text x="330" y="587">critic</text><text x="330" y="649">verifier</text><text x="330" y="711">evaluation</text><text x="330" y="347" fill="#633806" font-size="12">gate 2 (human)</text></g><g text-anchor="middle" font-size="11" fill="#5F5E5A"><text x="330" y="169">LLM extract</text><text x="330" y="262">retrieve + grade</text><text x="330" y="417">polish + save</text><text x="330" y="479">score fit</text><text x="330" y="541">CV patcher</text><text x="330" y="603">uses active_rubric</text><text x="330" y="665">stub</text><text x="330" y="727">stub</text></g><g fill="none" stroke="#B4B2A9" stroke-dasharray="2 3" marker-end="url(#s)"><path d="M330 182V192"/><path d="M330 430V440"/><path d="M330 492V502"/><path d="M330 554V564"/><path d="M330 616V626"/><path d="M330 678V688"/></g><path d="M330 306V378" fill="none" stroke="#B4B2A9" stroke-dasharray="2 3"/><g fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#w)"><path d="M410 95H468"/><path d="M410 157H468"/><path d="M410 219H468"/><path d="M410 281H468"/><path d="M390 343H468"/><path d="M410 405H468"/><path d="M410 467H468"/><path d="M410 529H468"/><path d="M410 591H468"/><path d="M410 653H468"/><path d="M410 715H468"/></g><g fill="#E1F5EE" stroke="#0F6E56"><rect x="20" y="194" width="190" height="50" rx="8"/><rect x="20" y="280" width="190" height="50" rx="8"/><rect x="20" y="380" width="190" height="50" rx="8"/></g><g fill="none" stroke="#0F6E56" stroke-dasharray="4 3"><rect x="20" y="566" width="190" height="50" rx="8"/><rect x="20" y="628" width="190" height="50" rx="8"/></g><g text-anchor="middle" fill="#085041"><text x="115" y="215">Retriever (RAG)</text><text x="115" y="301">Chroma vectors</text><text x="115" y="401">Knowledge base JSON</text><text x="115" y="587">Learning store</text><text x="115" y="649">Do-not-claim list</text></g><g text-anchor="middle" font-size="11" fill="#0F6E56"><text x="115" y="232">hybrid + rerank</text><text x="115" y="318">bge-base, cosine</text><text x="115" y="418">source of truth</text><text x="115" y="604">no callers yet</text><text x="115" y="666">never embedded</text></g><g fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#t)"><path d="M250 210H212"/><path d="M212 232H248"/><path d="M95 244V278"/><path d="M135 280V246"/><path d="M115 380V332"/><path d="M250 405H212"/><path d="M250 390L212 322"/></g><g fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#t)"><path d="M250 591H212"/><path d="M212 653H248"/></g><rect x="470" y="772" width="430" height="70" rx="6" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"/><text x="484" y="794" fill="#1F1F1E">Control fields (not agent output)</text><g font-size="11" fill="#5F5E5A"><text x="484" y="812">stage: every agent sets the next stage on return</text><text x="484" y="828">revision_count, supervisor_decision, active_rubric: supervisor; gate_feedback: gates</text></g><g font-size="11" fill="#5F5E5A"><path d="M20 872H50" stroke="#534AB7" stroke-width="1.5" marker-end="url(#w)"/><text x="58" y="876">agent writes field</text><path d="M180 872H210" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#t)"/><text x="218" y="876">data read or write</text><path d="M350 872H380" stroke="#0F6E56" stroke-dasharray="4 3" marker-end="url(#t)"/><text x="388" y="876">planned, not wired</text><text x="20" y="900">Reads are listed in each row. Stubs (verifier, evaluation) write placeholder values and read nothing yet.</text><text x="20" y="918">Gate 2 is the only gate that writes a content field; profile_enrich then appends to evidence via merge_evidence.</text></g></svg>
